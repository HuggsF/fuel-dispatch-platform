# Local infrastructure for fuel-dispatch-platform (FND-2.1, FND-2.2, FND-2.4).
#
#   docker compose up -d        # start PostgreSQL, MongoDB and Kafka
#   docker compose ps           # every service should report "healthy"
#   docker compose --profile apps up -d --build   # also build and run both services
#
# Credentials are local-only defaults. Override them by copying .env.example to .env.

name: fuel-dispatch-platform

services:
  postgres:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dispatch}
      POSTGRES_USER: ${POSTGRES_USER:-dispatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dispatch}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7.0.43
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:-tracking}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-tracking}
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Single-node Kafka in KRaft mode (broker + controller, no ZooKeeper).
  # Host clients use localhost:9092; containers on this network use kafka:19092.
  kafka:
    image: apache/kafka:4.3.1
    environment:
      CLUSTER_ID: fuel-dispatch-local-01
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:19092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s

  # Application services, only with: docker compose --profile apps up -d --build (FND-2.3)
  dispatch-service:
    profiles: [apps]
    build:
      context: .
      dockerfile: dispatch-service/Dockerfile
    image: fuel-dispatch/dispatch-service:local
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-dispatch}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-dispatch}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-dispatch}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8081:8081"

  tracking-service:
    profiles: [apps]
    build:
      context: .
      dockerfile: tracking-service/Dockerfile
    image: fuel-dispatch/tracking-service:local
    ports:
      - "8082:8082"

volumes:
  postgres-data:
  mongo-data:
  kafka-data:
