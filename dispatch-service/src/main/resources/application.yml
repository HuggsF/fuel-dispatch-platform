spring:
  application:
    name: dispatch-service
  # Local defaults match docker-compose.yml; override with SPRING_DATASOURCE_URL/USERNAME/PASSWORD.
  datasource:
    url: jdbc:postgresql://localhost:5432/dispatch
    username: dispatch
    password: dispatch
  jpa:
    open-in-view: false
    hibernate:
      # Schema is owned by Flyway only (API-3.1).
      ddl-auto: validate
  # Local default matches docker-compose.yml; override with SPRING_KAFKA_BOOTSTRAP_SERVERS.
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      # Key = orderId (EVT-2.2). Value = the event JSON already built by the outbox, sent as plain
      # text so no Spring type headers leak into the contract (EVT-3.1).
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      # A message counts as sent only once every in-sync replica has it; retries never duplicate.
      acks: all
      properties:
        enable.idempotence: true
        # Fail fast when Kafka is down instead of blocking the relay's transaction for 60 s;
        # the rows stay in the outbox and are retried on the next poll (EVT-1.3, EVT-2.4).
        max.block.ms: 5000

server:
  port: 8081
